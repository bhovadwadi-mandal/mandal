<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>भोवडवाडी उत्कर्ष मंडळ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3b1a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="उत्कर्ष मंडळ">
<style>
:root{--bg:#0f0b09;--hd:#3a1c0e;--card:#1c1511;--card2:#261c15;--tx:#f4e9dd;--mut:#a89684;--ac:#eaa73c;--or:#c8460f;--bd:#33261d;--ok:#4ade80;--bad:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Devanagari","Mukta",system-ui,sans-serif;line-height:1.5;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#4d2512;z-index:10}
.w{max-width:560px;margin:0 auto}
.top{background:#4d2512;padding:14px 16px 0;display:flex;align-items:center;gap:12px}
.top.r{background:linear-gradient(160deg,#4d2512,#2e1408);border-radius:0 0 24px 24px;padding-bottom:14px;margin-bottom:8px;box-shadow:0 6px 18px #0006}
.lg{width:50px;height:50px;border-radius:50%;border:2px solid #b8772a;object-fit:cover;flex:none;box-shadow:0 0 0 3px #ffffff14}
.top h1{font-size:17px;margin:0;line-height:1.25;font-weight:700}
.top small{color:#cdb8a2;font-size:12px}
.mn{margin-left:auto;background:#ffffff14;border:0;color:var(--tx);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.hero{background:linear-gradient(180deg,#4d2512,#2e1408);padding:14px 16px 22px;border-radius:0 0 30px 30px;box-shadow:0 10px 24px #0007}
.big{font-size:38px;font-weight:800;color:var(--ac);line-height:1.15;letter-spacing:-.5px}
.pill{background:#ffffff14;color:var(--tx);border:1px solid #ffffff22;border-radius:20px;padding:7px 12px;font:inherit;font-size:13px}
.bar{height:7px;background:#ffffff1f;border-radius:4px;margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#eaa73c,#f6c56a);border-radius:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two small{color:var(--mut);display:block;font-size:12px}
.two b{font-size:21px}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{background:#ffffff14;border:1px solid #ffffff1c;border-radius:18px;padding:6px 14px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 6px 12px;color:var(--tx);font:inherit;font-weight:600;font-size:14px;box-shadow:0 2px 8px #0004}
.tile i{display:flex;width:46px;height:46px;margin:0 auto 8px;border-radius:14px;align-items:center;justify-content:center}
.sec{padding:12px 16px 0}
.ph{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}
.ph h2{margin:0;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #0003}
.row{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:#3a2314;color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.g{flex:1;min-width:0}.n{font-weight:600}.s{color:var(--mut);font-size:13px}
.a{font-weight:800;color:var(--ac);white-space:nowrap}.ok{color:var(--ok)}.bd{color:var(--bad)}
h3{margin:16px 0 8px;color:#f59e4b;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select.f{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid #eaa73c66;border-color:var(--ac)}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:14px;background:linear-gradient(180deg,#d9531a,#b83c0b);color:#fff;font:inherit;font-weight:700;text-align:center;display:block;text-decoration:none;box-shadow:0 3px 10px #c8460f44}
.btn.alt{background:var(--card2);border:1px solid var(--bd);color:var(--tx);box-shadow:none}
.sm{width:auto;margin:6px 0 0;padding:6px 12px;font-size:12px;background:none;border:1px solid var(--ac);color:var(--ac);display:inline-block;box-shadow:none;border-radius:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:#17110dee;backdrop-filter:blur(8px);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:6;border-top:1px solid var(--bd)}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11.5px;padding:6px 0;border-radius:14px}
nav button svg{display:block;margin:0 auto 2px}
nav button.on{color:var(--ac);background:#2b1d12}
.rc{border:2px dashed var(--ac);border-radius:16px;padding:16px;background:var(--card)}
.rc table{width:100%;border-collapse:collapse;font-size:14px}
.rc td{padding:6px 0;border-bottom:1px solid var(--bd)}
.rc td:first-child{color:var(--mut);width:36%}
.note{font-size:12px;color:var(--mut);text-align:center;margin:14px 16px}
</style>
</head>
